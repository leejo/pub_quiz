3. On this day in 2009, what happened to US Airways Flight 1549? ***Ditched safely in The Hudson River***
--

4. On this day, in 2015, what did The Swiss National Bank do, causing turmoil in international markets? ***Abandoned the cap on the Swiss franc’s value relative to the Euro.***
--

5. Which country is expected to adopt the euro and become the 21st member state of the eurozone this year? ***Bulgaria***
--

6. Which country is aiming to effectively ban sales of new diesel and petrol cars this year? ***Norway***

7. Which social media platform is being banned in the USA next week? ***TikTok***

(Drugs)

class:
# Round 5

--

1. N-acetyl-para-aminophenol, or Acetaminophen,  is more commonly known as what? ***Paracetamol / Tylenol / Panadol***
--

2. What significant discovery happened by chance in 1928? ***Penicillin***
--

3. Which class of drug is the most prescribed worldwide? ***Statins (Cholesterol controlling)***
--

4. Ozempic, a weight control drug, was originally created and then approved in 2017 to treat what? ***Type 2 Diabetes***
--

5. How long is a drug patent valid for (from the filling date)? 10, 15, 20, or 25 years? ***20 years***
--

6. Which country has the highest number of pharmacy per 100k residents, Greece, Spain, or France? ***Greece - 97/100k, then Spain (47/100k). France has 31/100k. Suisse has 21/100k***
--

7. Which year 2000 movie about the illegal drug trade won 4 Oscars, including best director? ***Traffic***
--

8. The First Opium War took place between which two countries? ***British Empire &amp; China (1839 to 1842), resulted in Hong Kong Island being formally ceded to the UK***
--

9. Which drug is trafficked the most globally? ***Meth(amphetamine) / Cocaine (depending on where you get your stats)***
--

10. Which is the most consumed drug globally? ***Alcohol***
