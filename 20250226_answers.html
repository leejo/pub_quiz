class:
# Round 3

1. What year saw the release of the first commercial 3D printers? **2009, because the patents entered the public domain**

--
2. In which year did the European Union officially adopt the euro as its currency? **1999 (Note: physical euro banknotes and coins entered circulation in 2002.)**

--
3. Which space probe, launched in 2006, reached Pluto in 2015? **New Horizons**

--
4. In 2015, which country became the first to legalise same-sex marriage by popular vote? **Ireland**

--
5. What was the name of the first cloned mammal, which was born in 1996? **Dolly the Sheep**

--
6. In 2006, which African country became the first to have an elected female head of state? **Liberia (Ellen Johnson Sirleaf)**

--
7. Which video game, released in 2011, became the best-selling video game of all time? **Minecraft**

--
8. In 2022, which company acquired major Hollywood studio MGM? **Amazon**

--
9. In what year did SpaceX successfully land a reusable rocket for the first time? **2015 (Falcon 9)**

--
10. What didn't fit in the trial of O.J. Simpson in 1995? **Gloves**
